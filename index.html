<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside the Calculator</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <div id="workspace">
        <main id="view"></main>
        <aside id="panel" aria-label="Explore">
          <label id="explore-label" for="explore"></label>
          <select id="explore"></select>
          <h3 id="bench-title" hidden></h3>
          <ol id="bench-steps"></ol>
          <section id="bus-panel" aria-label="Numbers" hidden></section>
          <section id="stats" class="stats" aria-label="Transistor count" hidden>
            <p id="stats-total"></p>
            <p id="stats-view"></p>
            <p id="stats-note" class="muted small"></p>
          </section>
          <p id="bench-help" class="muted"></p>
          <p id="slowmo-note" class="muted small"></p>
        </aside>
      </div>
      <footer id="clock-bar">
        <div id="clock" class="clock"></div>
        <label id="speed-label" class="speed"><span id="speed-name"></span>
          <input id="speed" type="range" min="0" max="100" value="40" />
          <span id="speed-value"></span>
        </label>
        <span class="spacer"></span>
        <span id="fps" aria-live="off">— fps</span>
        <button id="quality-btn" type="button" title="Graphics quality">⚙ quality: auto</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
