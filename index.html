<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside the Calculator</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <div id="workspace">
        <main id="view"></main>
        <aside id="panel" aria-label="Lab bench">
          <h2 id="panel-heading"></h2>
          <div id="bench-buttons" role="group" aria-label="Choose a component"></div>
          <h3 id="bench-title"></h3>
          <ol id="bench-steps"></ol>
          <p id="bench-help" class="muted"></p>
          <p id="slowmo-note" class="muted small"></p>
        </aside>
      </div>
      <footer id="clock-bar">
        <span class="title">Inside the Calculator</span>
        <label class="slowmo">slow motion
          <input id="slowmo" type="range" min="0" max="100" value="60" />
          <span id="slowmo-value"></span>
        </label>
        <button id="home-btn" type="button" title="Back to the whole bench (Home)">⌂ Home</button>
        <span class="spacer"></span>
        <span id="fps" aria-live="off">— fps</span>
        <button id="quality-btn" type="button" title="Graphics quality">⚙ quality: auto</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
